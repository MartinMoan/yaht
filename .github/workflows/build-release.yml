name: Build and release

# Builds portable Windows + Linux bundles with PyInstaller (see
# packaging/README.md for the reasoning), two flavors per OS -- a onedir
# zip/tarball and a single-file standalone exe/binary -- and, when
# triggered by a version tag, publishes all four as assets on a new
# GitHub Release.
#
# To cut a release: `git tag v1.2.3 && git push origin v1.2.3`.
# `workflow_dispatch` also lets you run a build on demand (e.g. from a
# branch, to sanity-check the build itself) without publishing a release --
# the release job only runs for an actual `v*` tag push.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # required for the release job to create a release and upload assets

env:
  PYTHON_VERSION: "3.12"
  # SignPath code-signing config (see packaging/README.md "Code signing"
  # section for full setup instructions). TODO: fill these in once your
  # SignPath Foundation application is approved and you've created a
  # project + signing policy in the SignPath dashboard. Signing is
  # skipped entirely (with no build failure) until the SIGNPATH_API_TOKEN
  # repo secret is set, so it's safe to leave these placeholders in place
  # until then.
  SIGNPATH_ORGANIZATION_ID: "TODO-signpath-organization-id"
  SIGNPATH_PROJECT_SLUG: "yaht"
  SIGNPATH_SIGNING_POLICY_SLUG: "release-signing"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        # Builds both targets defined in the spec file: the onedir folder
        # (dist/YAHT/) and the single-file standalone exe
        # (dist/YAHT-standalone.exe) -- see packaging/yaht.spec for
        # why both exist.
        run: pyinstaller packaging/yaht.spec --noconfirm

      # -- Code signing (SignPath) -----------------------------------
      # Only the two exes we actually build are signed, not the
      # third-party Qt/Python DLLs bundled alongside them -- that's what
      # gives the app a verified publisher identity, which is what
      # Windows SmartScreen actually cares about. Every step below is a
      # no-op (skipped, not failed) until SIGNPATH_API_TOKEN is set as a
      # repo secret, so this is safe to leave in an unconfigured repo.
      - name: Upload unsigned onedir exe for signing
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        id: upload-unsigned-onedir-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-YAHT-onedir-exe
          path: dist/YAHT/YAHT.exe
          if-no-files-found: error

      - name: Sign onedir exe
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-onedir-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/onedir

      - name: Replace onedir exe with signed version
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed/onedir/YAHT.exe dist/YAHT/YAHT.exe -Force

      - name: Upload unsigned standalone exe for signing
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        id: upload-unsigned-standalone-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-YAHT-standalone-exe
          path: dist/YAHT-standalone.exe
          if-no-files-found: error

      - name: Sign standalone exe
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-standalone-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/standalone

      - name: Replace standalone exe with signed version
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Copy-Item signed/standalone/YAHT-standalone.exe dist/YAHT-standalone.exe -Force
      # -- End code signing --------------------------------------------

      - name: Package onedir build as a zip
        shell: pwsh
        run: Compress-Archive -Path dist/YAHT/* -DestinationPath YAHT-windows-x64.zip

      - name: Rename standalone exe
        shell: pwsh
        run: Rename-Item dist/YAHT-standalone.exe YAHT-windows-x64-standalone.exe

      - uses: actions/upload-artifact@v4
        with:
          name: YAHT-windows-x64
          path: YAHT-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: YAHT-windows-x64-standalone
          path: dist/YAHT-windows-x64-standalone.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux system libraries QtWebEngine needs
        # Needed on this build machine too, not just at runtime -- PyInstaller
        # has to actually import PySide6.QtWebEngineWidgets while analyzing
        # the app. See requirements.txt / packaging/README.md for background.
        # libasound2 was renamed libasound2t64 in Ubuntu 24.04's time_t
        # transition -- try the new name first, fall back to the old one so
        # this keeps working if ubuntu-latest moves again.
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libxkbfile1 libxcb-cursor0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        # Builds both targets defined in the spec file: the onedir folder
        # (dist/YAHT/) and the single-file standalone binary
        # (dist/YAHT-standalone) -- see packaging/yaht.spec for why
        # both exist.
        run: pyinstaller packaging/yaht.spec --noconfirm

      - name: Package onedir build as a tarball
        run: tar czf YAHT-linux-x64.tar.gz -C dist YAHT

      - name: Rename and prepare standalone binary
        # tar (not a bare file) so the executable bit survives download --
        # GitHub strips permissions from plain uploaded files, and a user
        # would otherwise have to remember to chmod +x it themselves.
        run: |
          mv dist/YAHT-standalone YAHT-linux-x64-standalone
          chmod +x YAHT-linux-x64-standalone
          tar czf YAHT-linux-x64-standalone.tar.gz YAHT-linux-x64-standalone

      - uses: actions/upload-artifact@v4
        with:
          name: YAHT-linux-x64
          path: YAHT-linux-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: YAHT-linux-x64-standalone
          path: YAHT-linux-x64-standalone.tar.gz
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release with all four builds attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/YAHT-windows-x64/YAHT-windows-x64.zip \
            artifacts/YAHT-windows-x64-standalone/YAHT-windows-x64-standalone.exe \
            artifacts/YAHT-linux-x64/YAHT-linux-x64.tar.gz \
            artifacts/YAHT-linux-x64-standalone/YAHT-linux-x64-standalone.tar.gz \
            --title "${{ github.ref_name }}" \
            --generate-notes
